<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Macro</title>
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Open Macro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="view" aria-live="polite"></main>
<nav>
  <button class="tab on" data-tab="diary"><span>📒</span>Diary</button>
  <button class="tab" data-tab="weight"><span>📈</span>Weight</button>
  <button class="tab" data-tab="kitchen"><span>🧺</span>Kitchen</button>
  <button class="tab" data-tab="foods"><span>🍎</span>Foods</button>
  <button class="tab" data-tab="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
